name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 cannot build: the postbuild runtime-deps check uses
        # `node --experimental-strip-types` (requires >=22.6). See package.json engines.
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Native tree-sitter grammars are optional peers (never packaged; see
      # install-policy tests + docs/user-guide/parser-runtime.md). The test
      # suite exercises them, so install them into node_modules WITHOUT saving
      # to package.json/lock. --legacy-peer-deps bypasses the kotlin grammar's
      # stale tree-sitter@^0.22.4 peer range.
      - name: Install native tree-sitter grammars (test-only)
        run: |
          npm install --no-save --legacy-peer-deps \
            tree-sitter@^0.25.0 tree-sitter-go@^0.25.0 tree-sitter-java@^0.23.5 \
            tree-sitter-python@^0.25.0 tree-sitter-cpp@^0.23.4 \
            @tree-sitter-grammars/tree-sitter-kotlin@^1.1.0

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "Error: Coverage $COVERAGE% is below 80%"
              exit 1
            fi
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.node-version == 22
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: All checks passed
        run: echo "✅ All quality gates passed successfully"
