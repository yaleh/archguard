# Java module-layer knowledge (TASK-63).
# Import patterns and entity-node rules interpreted by the RuleEngine.
# Relation emission mirrors the imperative JavaPlugin surface: field and
# parameter dependencies are emitted; import relations are not (the imperative
# Java plugin builds relations from extends/implements/field/parameter, not
# from import statements).
import_patterns:
  - type: java_import
    pattern: '^import (?:static )?([a-zA-Z0-9_.]+);'
    module_group: 1

entity_nodes:
  - node_type: class_declaration
    entity_type: class
    abstract_entity_type: abstract_class
    name_field: name
    body_field: body
    method_node: method_declaration
    field_node: field_declaration
    constructor_node: constructor_declaration
    extends_field: superclass
    implements_field: interfaces
    type_identifier_node: type_identifier
  - node_type: interface_declaration
    entity_type: interface
    name_field: name
    body_field: body
    method_node: method_declaration
    extends_field: extends_interfaces
    type_identifier_node: type_identifier
  - node_type: enum_declaration
    entity_type: enum
    name_field: name
    body_field: body

relations:
  inheritance: true
  implementation: true
  field_dependency: true
  parameter_dependency: true
  import_dependency: false

path_resolution:
  root_relative: true
  extensions: [".java"]
  index_files: []
