providers:
  native:
    enabled: true
    path: /home/yale/work/archguard/.quay/runtime
    tasks_dir: /home/yale/work/archguard/tasks
    mcp_entry:
    - node
    - /home/yale/work/archguard/.quay/runtime/bin/quay-native.js
    - mcp
    default_task_status: ready
    env:
      QUAY_NATIVE_TASKS_DIR: /home/yale/work/archguard/tasks
      QUAY_NATIVE_ADR_DIR: /home/yale/work/archguard/quay-adr
gates:
  testPass:
  - name: vitest
    command: npx vitest run
    timeoutMs: 300000
  - name: typecheck
    command: npx tsc --noEmit
    timeoutMs: 120000
  - name: build
    command: npm run build
    timeoutMs: 300000
  - name: lint
    command: npx eslint src/ --max-warnings 0
    timeoutMs: 60000
loop:
  repo_root: /home/yale/work/archguard
  test_command: npx vitest run
  tmux_session: archguard-0
  worktree_root: /home/yale/work/archguard-worktrees
