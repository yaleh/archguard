providers:
  native:
    enabled: true
    path: .
    mcp_entry:
    - quay-native
    - mcp
    default_task_status: ready
    env:
      QUAY_NATIVE_TASKS_DIR: ./tasks
      QUAY_NATIVE_ADR_DIR: ./quay-adr
gates:
  testPass:
  - name: vitest
    command: npx vitest run
    timeoutMs: 300000
  - name: typecheck
    command: npx tsc --noEmit
    timeoutMs: 120000
  - name: build
    command: npm run build
    timeoutMs: 300000
  - name: lint
    command: npx eslint src/ --max-warnings 0
    timeoutMs: 60000
loop:
  repo_root: /home/yale/work/archguard
  test_command: npx vitest run
  tmux_session: archguard-4
  worktree_root: /home/yale/work/archguard-worktrees
