# layers.yml — DRAFT（2026-10-02）。archguard 自身的层映射：glob → 层，以及允许的依赖方向。
#
# 状态：draft，由 LLM 起草、尚未经人审裁决。人审之前它是"声明"，不是不变量。
# 方向约定：edge "A -> B" 表示 A 的代码 import B。allowed 里没列的方向 = 禁止（同层除外）。
# 取边来源：ArchGuard 的 extensions.tsAnalysis.moduleGraph.edges（目录级边，不是解析 relation.id）。
# 层的起草依据：CLAUDE.md 的三层架构（Parser / Mermaid / CLI）+ 实测边；
#   plugins/shared 被单独拆成 plugin-runtime —— 它是解析运行时/语法树类型，被 core 与 parser 依赖，
#   并进 plugins 会把正常依赖误报成违例。

layers:
  types:
    rank: 0
    globs: ["src/types", "src/types/**", "src/utils", "src/utils/**"]
  plugin-runtime:
    rank: 1
    globs: ["src/plugins/shared", "src/plugins/shared/**"]
  core:
    rank: 2
    globs: ["src/core", "src/core/**"]
  parser:
    rank: 3
    globs: ["src/parser", "src/parser/**"]
  plugins:
    rank: 4
    globs: ["src/plugins", "src/plugins/**"]      # 最长匹配优先，plugins/shared 归 plugin-runtime
  mermaid:
    rank: 4
    globs: ["src/mermaid", "src/mermaid/**"]
  analysis:
    rank: 5
    globs: ["src/analysis", "src/analysis/**"]
  cli:
    rank: 6
    globs: ["src/cli", "src/cli/**"]
  entry:
    rank: 7
    globs: ["src"]                                 # src/index.ts 等根文件

# 非生产目录：不参与层检查，也不算覆盖缺口
ignore: ["tests", "tests/**", "examples", "examples/**", "templates", "templates/**", "scripts", "scripts/**", ""]

# 目标方向（人裁决前是草案）
allowed:
  - plugin-runtime -> types
  - plugin-runtime -> core
  - plugin-runtime -> parser
  - plugin-runtime -> plugins      # 动态装配边：plugin-factory 动态 import 具体语言插件
  - core -> types
  - parser -> types
  - parser -> core
  - parser -> plugins              # 动态装配边：parse-worker 动态 import 具体语言插件
  - plugins -> types
  - plugins -> core
  - plugins -> parser
  - plugins -> plugin-runtime
  - mermaid -> types
  - mermaid -> core
  - analysis -> types
  - analysis -> core
  - analysis -> parser
  - analysis -> plugin-runtime
  - analysis -> plugins
  - analysis -> mermaid
  - cli -> types
  - cli -> core
  - cli -> parser
  - cli -> plugin-runtime
  - cli -> plugins
  - cli -> mermaid
  - cli -> analysis
  - entry -> types
  - entry -> core
  - entry -> parser
  - entry -> plugins
  - entry -> mermaid
  - entry -> analysis
  - entry -> cli

# 已实测存在的违例基线（棘轮：只许减不许增）。2026-10-02 首次运行的结果，证据已用位置判定的 grep 核对。
# 注意：这是"现状快照"，不是"这些方向是对的"——是否接受、如何消除由人裁决。
# 2026-10-03（gap-layer-mutual-plugin-runtime-core-parser，裁定 A'）：解析运行时接口下移到
# src/core/parser-runtime/，core/parser 改为经 ParserBackendResolver 端口注入，因此
# core -> plugin-runtime、parser -> plugin-runtime 两条边消失并已从 allowed 删除；
# plugin-runtime -> core / plugin-runtime -> parser 由基线转为允许方向（见上方 allowed）。
# 同时，check-layers 对新的 module graph 汇报 analysis -> cli、core -> cli、core -> mermaid
# 三条基线项已消除（positional grep 复核：src/analysis、src/core 已无对应 import），
# 一并从基线删除——基线只保留仍然存在的违例。
known_violations: []
